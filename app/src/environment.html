<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"><title>系统环境变量</title><style>
:root{color-scheme:light dark;--brand:#d9483b;--text:#202124;--muted:#687078;--surface:#fff;--field:#f3f4f6;--line:#dfe2e6}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--surface);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}h1{margin:0;font-size:20px}p{color:var(--muted);line-height:1.6}.notice{padding:10px 12px;border-radius:8px;background:#fff3ef;color:#92352e}.rows{margin:20px 0}.row{display:grid;grid-template-columns:220px minmax(0,1fr) 60px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}code{font-size:11px}input[type=text]{width:100%;height:36px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--text)}.add-form{display:none;grid-template-columns:1fr 1fr auto auto;gap:8px;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:8px}.add-form.visible{display:grid}.actions{display:flex;justify-content:flex-end;gap:8px}.actions .add{margin-right:auto}button{min-height:36px;padding:7px 14px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font-weight:600;cursor:pointer}.primary{border-color:#bd352c;background:var(--brand);color:#fff}.status{min-height:20px;margin-top:12px;text-align:right;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--text:#eef0f2;--muted:#a8afb7;--surface:#202124;--field:#292b2f;--line:#3b3f45}}
.value-field{position:relative;min-width:0}.value-field input{padding-right:36px}.history-toggle{position:absolute;right:1px;top:1px;min-height:34px;width:34px;padding:0;border:0;background:transparent}.history-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:10;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--surface);box-shadow:0 4px 12px #0002}.history-option,.history-empty{padding:9px;overflow-wrap:anywhere}.history-option{cursor:pointer;white-space:pre-wrap}.history-option:hover,.history-option[aria-selected=true]{background:var(--field)}.history-empty{color:var(--muted)}button:disabled{opacity:.45;cursor:default}input:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}</style></head><body><h1>用户级系统环境变量</h1><p>配置只对之后启动的应用生效。直接编辑后保存，留空会保存为空字符串。自定义变量可删除，删除立即生效并保留历史；默认变量不可删除。值会去除首尾空格；输入可匹配历史，点击下拉箭头可查看全部。</p><div class="notice">保存后，请完全退出并重新启动目标 Electron、终端或 React Native 进程。</div><div id="rows" class="rows"></div><div id="add-form" class="add-form"><input id="new-key" type="text" placeholder="变量名，例如 MY_VARIABLE"><input id="new-description" type="text" placeholder="用途说明（可选）"><button id="confirm-add" class="primary">确认添加</button><button id="cancel-add">取消</button></div><div class="actions"><button id="add" class="add">＋ 添加环境变量</button><button id="refresh">重新读取</button><button id="save" class="primary">保存到系统</button></div><div id="status" class="status" role="status"></div><script src="environment.js"></script></body></html>
