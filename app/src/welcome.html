<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>红糖开发助手</title>
  <style>
    :root{color-scheme:light dark;--brand:#d9483b;--brand-hover:#bd352c;--amber:#f0a12b;--green:#18864b;--text:#202124;--muted:#687078;--surface:#fff;--surface-2:#f5f6f8;--line:#dde1e6}
    *{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.tabs{height:44px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface-2);display:flex;align-items:flex-end}.tab{height:44px;padding:13px 8px 10px;border-bottom:3px solid var(--brand);color:var(--brand);font-weight:650}
    .main{min-height:calc(100vh - 44px);max-width:1120px;margin:auto;padding:56px;display:grid;grid-template-columns:minmax(300px,.85fr) minmax(440px,1.15fr);gap:72px;align-items:center}.hero{padding:24px}.brand{display:flex;align-items:center;gap:14px}.brand-mark{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:#fff1ed;color:var(--brand)}.brand-mark svg{width:34px;height:34px}.brand-name{font-size:25px;font-weight:700;letter-spacing:-.02em}.subtitle{max-width:390px;margin:28px 0 24px;color:var(--muted);font-size:17px;line-height:1.7}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;font-weight:650}
    .card{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 16px 44px #18202b12;overflow:hidden}.card-header{padding:20px 22px;border-bottom:1px solid var(--line)}.status{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:650}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(24,134,75,.14)}.hint{margin:6px 0 0;color:var(--muted);line-height:1.5}.connect{display:grid;grid-template-columns:184px minmax(0,1fr);gap:22px;padding:22px}.qr-wrap{text-align:center}.qr-frame{display:inline-flex;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.qr{display:block;width:150px;height:150px}.qr-caption{margin:9px 0 0;color:var(--muted);font-size:11px}.field-label{display:block;margin-bottom:6px;color:var(--muted);font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.05em}.url code{display:block;min-height:58px;padding:10px;border-radius:8px;background:var(--surface-2);font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;user-select:all}.primary,.target button{border-radius:7px;font-weight:650;cursor:pointer}.primary{width:100%;min-height:38px;margin-top:12px;border:1px solid var(--brand-hover);background:var(--brand);color:#fff}.primary:hover{background:var(--brand-hover)}button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}.steps{margin:11px 0 0;color:var(--muted);font-size:10px;line-height:1.6}.targets{padding:0 22px 12px}.targets-title{padding:14px 0 5px;border-top:1px solid var(--line);font-weight:650}.target{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.target button{min-height:32px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);color:var(--text)}.empty{padding:14px 0;color:var(--muted)}
    .environment{margin:auto 0 auto auto;min-height:32px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}.environment:hover{background:var(--surface-2)}
    @media(max-width:850px){.main{grid-template-columns:1fr;padding:32px;gap:28px}.hero{padding:0}.subtitle{margin:16px 0}.connect{grid-template-columns:166px minmax(0,1fr)}.qr{width:132px;height:132px}}@media(max-width:560px){.main{padding:18px}.connect{grid-template-columns:1fr}.qr-wrap{text-align:left}.hero .chips{display:none}}@media(prefers-color-scheme:dark){:root{--text:#eef0f2;--muted:#a8afb7;--surface:#202124;--surface-2:#292b2f;--line:#3b3f45}.brand-mark{background:#462825}.card{box-shadow:0 16px 44px #0005}.qr-frame{border-color:#50545a}}@media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body>
  <div class="tabs"><div class="tab">Welcome</div><button id="environment" class="environment" type="button">设置系统环境变量</button></div>
  <main class="main">
    <section class="hero"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 10.5A9 9 0 0 1 22.2 7L25 4.5v8.2A9 9 0 0 1 10.4 22l-3.9 2.7 1.3-5.1A9 9 0 0 1 7 10.5Z" fill="currentColor"/><path d="M12 12.5h8M12 16h5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></span><span class="brand-name">红糖开发助手</span></div><p class="subtitle">一体化 App 调试工作台，快速定位日志、网络请求和实时通信问题。</p><div class="chips"><span class="chip">Console</span><span class="chip">Network</span><span class="chip">WebSocket</span></div></section>
    <section class="card" aria-label="应用连接"><header class="card-header"><div class="status" id="status">正在启动调试服务…</div><p class="hint">扫描二维码或复制连接配置，将应用接入当前电脑。</p></header><div class="connect"><div class="qr-wrap"><span class="qr-frame"><img class="qr" id="qr" alt="红糖云服调试服务连接二维码"></span><p class="qr-caption">使用 App 扫码快速连接</p></div><div class="url"><span class="field-label">服务地址</span><code id="url">—</code><button class="primary" id="copy" type="button">复制连接配置</button><p class="steps">App 设置 → DevTools 调试 → 扫码并开启</p></div></div><div class="targets"><div class="targets-title">已连接的应用</div><div id="targets" class="empty">等待应用连接…</div></div></section>
  </main>
  <script src="welcome.js"></script>
</body>
</html>
